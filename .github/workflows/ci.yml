name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: courtside_launchpad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/check-env-staging.mjs --tracked
      - run: node scripts/audit-repository.mjs --tracked-only
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:database:local
      - run: npm run test:database:sports
      - run: npm run test:database:sports-upgrade
      - run: npm run test:database:concurrency
        env:
          # Ephemeral local CI service only; never hosted Supabase credentials.
          LAUNCHPAD_TEST_DATABASE_URL: postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/courtside_launchpad_test
      - run: npm run test:database:sports-concurrency
        env:
          LAUNCHPAD_TEST_DATABASE_URL: postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/courtside_launchpad_test
      - run: npm run build
      - run: node scripts/check-ocr-bundle.mjs
