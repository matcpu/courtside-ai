name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/check-env-staging.mjs --tracked
      - run: node scripts/audit-repository.mjs --tracked-only
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
